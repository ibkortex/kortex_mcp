[project]
name = "kortex-mcp"
version = "0.1.0"
description = "Kortex MCP server: data plane (personal API key) and knowledge tools (Cognito login), over stdio or local HTTP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27.0",
    "requests>=2.31",
    "pycognito>=2024.5.1",
    "boto3>=1.34",
    "uvicorn>=0.30",
]

[project.scripts]
kortex-mcp = "mcps.kortex_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
