[project]
name = "kortex-mcp"
version = "0.1.0"
description = "Kortex data plane MCP server for Claude Desktop"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
kortex-mcp = "mcps.kortex_mcp.server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
